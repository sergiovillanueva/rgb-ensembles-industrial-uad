[project]
name = "rgb-ensembles-industrial-uad"
version = "1.0.0"
description = "RGB Ensemble Strategies for Unsupervised Industrial Anomaly Detection on the AutoVI Dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # PyTorch (CUDA 12.8 wheels via uv index-url below)
    "torch==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    # Core AD / features
    "anomalib==2.1.0",
    "lightning==2.5.2",
    "transformers==4.57.3",
    "timm==1.0.19",
    "huggingface_hub[hf_xet]==0.36.0",
    "accelerate==1.10.0",
    # Image + numerics
    "opencv-python==4.12.0.88",
    "albumentations==2.0.8",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.1",
    "scipy==1.16.1",
    # Experiment + reporting
    "tqdm==4.67.1",
    "pyyaml==6.0.3",
    "matplotlib==3.10.5",
    "pandas==2.2.3",
    "Pillow==11.0.0",
]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu128"
extra-index-url = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"
